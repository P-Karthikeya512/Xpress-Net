<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XpressNet — Login</title>
  <link rel="stylesheet" href="tailwind.css" />
  <link rel="stylesheet" href="login.css" />
  <script defer src="auth.js"></script>
  <script defer src="login.js"></script>
</head>
<body class="min-h-screen">
  <main class="min-h-screen grid lg:grid-cols-[1.05fr_0.95fr]">
    <section class="relative overflow-hidden bg-[#080d1a] text-white left-grid">
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_20%,rgba(124,58,237,.22),transparent_34%),radial-gradient(circle_at_50%_80%,rgba(99,102,241,.18),transparent_28%),linear-gradient(180deg,rgba(12,16,34,.92),rgba(7,10,20,.98))]"></div>
      <div class="absolute inset-0 opacity-50 bg-gradient-to-br from-transparent via-violet-600/10 to-transparent"></div>
      <div class="wave-corner wave-corner--tl"></div>
      <div class="wave-corner wave-corner--br"></div>

      <div class="relative z-10 flex h-full min-h-screen flex-col items-center justify-center px-6 py-12 text-center lg:px-10">
        <div class="mb-4">
          <h1 class="text-5xl font-extrabold tracking-tight sm:text-6xl">
            <span class="text-white">Xpress</span><span class="bg-gradient-to-r from-violet-300 to-fuchsia-400 bg-clip-text text-transparent">Net</span>
          </h1>
          <p class="mt-4 text-xl text-white/78">Face Expression Recognition</p>
        </div>

        <div class="my-8 h-1 w-16 rounded-full bg-gradient-to-r from-violet-400 to-fuchsia-500"></div>

        <p class="max-w-xl text-lg leading-8 text-white/82 sm:text-xl">
          Detect Expressions. Understand Emotions.<br />
          Built with Deep Learning.
        </p>

        <div class="mt-14 grid grid-cols-4 gap-4 sm:grid-cols-7 sm:gap-5">
          <div class="emotion-pill"><span class="emotion-emoji">😊</span><span>Happy</span></div>
          <div class="emotion-pill"><span class="emotion-emoji">☹️</span><span>Sad</span></div>
          <div class="emotion-pill"><span class="emotion-emoji">😠</span><span>Angry</span></div>
          <div class="emotion-pill"><span class="emotion-emoji">😮</span><span>Surprised</span></div>
          <div class="emotion-pill"><span class="emotion-emoji">😐</span><span>Neutral</span></div>
          <div class="emotion-pill"><span class="emotion-emoji">😨</span><span>Fear</span></div>
          <div class="emotion-pill sm:col-span-1 col-span-2 sm:justify-self-auto justify-self-center"><span class="emotion-emoji">🤢</span><span>Disgust</span></div>
        </div>
      </div>
    </section>

    <section class="relative flex items-center justify-center px-5 py-10 lg:px-8">
      <div class="curve-decoration"></div>
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_70%_25%,rgba(167,139,250,.18),transparent_22%),radial-gradient(circle_at_50%_90%,rgba(124,58,237,.08),transparent_25%)]"></div>

      <div class="relative z-10 w-full max-w-xl rounded-[2rem] bg-white p-8 sm:p-10 glass">
        <div class="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full border border-violet-100 bg-violet-50/80 shadow-inner">
          <span class="text-5xl font-black bg-gradient-to-r from-violet-500 to-fuchsia-500 bg-clip-text text-transparent">X</span>
        </div>

        <div class="text-center">
          <h2 class="text-4xl font-extrabold tracking-tight text-slate-900">Welcome Back</h2>
          <p class="mt-3 text-lg text-slate-500">Login to continue with <span class="font-semibold text-violet-600">XpressNet</span></p>
        </div>

        <div id="auth-message" class="hidden mt-6 rounded-xl border px-4 py-3 text-sm" role="alert"></div>

        <div class="mt-8 flex rounded-2xl bg-slate-100 p-1">
          <button id="login-tab" class="auth-tab active flex-1 rounded-2xl py-3 text-sm font-semibold" type="button">Login</button>
          <button id="register-tab" class="auth-tab flex-1 rounded-2xl py-3 text-sm font-semibold" type="button">Register</button>
        </div>

        <form id="login-form" class="mt-8 space-y-5">
          <label class="block" for="login-email">
            <span class="sr-only">Email address</span>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input id="login-email" name="email" type="email" placeholder="Email address" autocomplete="email" required class="input-field" />
            </div>
          </label>

          <label class="block" for="login-password">
            <span class="sr-only">Password</span>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required class="input-field" />
              <button type="button" class="toggle-eye" data-target="login-password" aria-label="Toggle password visibility">👁</button>
            </div>
          </label>

          <button type="submit" id="login-submit" class="primary-btn w-full">
            Login
          </button>
        </form>

        <form id="register-form" class="mt-8 space-y-5 hidden">
          <label class="block" for="register-email">
            <span class="sr-only">Email address</span>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input id="register-email" name="email" type="email" placeholder="Email address" autocomplete="email" required class="input-field" />
            </div>
          </label>

          <label class="block" for="register-password">
            <span class="sr-only">Password</span>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="register-password" name="password" type="password" placeholder="Password" autocomplete="new-password" required class="input-field" />
              <button type="button" class="toggle-eye" data-target="register-password" aria-label="Toggle password visibility">👁</button>
            </div>
          </label>

          <label class="block" for="confirm-password">
            <span class="sr-only">Confirm password</span>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1v4"/><path d="M8 5h8"/><rect x="4" y="5" width="16" height="18" rx="2"/><path d="M8 12l2 2 4-4"/></svg>
              <input id="confirm-password" name="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" required class="input-field" />
              <button type="button" class="toggle-eye" data-target="confirm-password" aria-label="Toggle password visibility">👁</button>
            </div>
          </label>

          <button type="submit" id="register-submit" class="primary-btn w-full">
            Create account
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-500">
          Secure login, private uploads, and JWT-protected history.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
